run:
  timeout: 3m
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - gosimple
    - staticcheck
    - typecheck
    - unused
    # - gofumpt
    - revive

linters-settings:
  revive:
    severity: warning
    rules:
      - name: indent-error-flow
      - name: unused-parameter
        disabled: true
      - name: unused-receiver
        disabled: true
      - name: blank-imports
        severity: error
  # gofumpt:
  #   extra-rules: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - govet
